<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="bold">VoiceHaptic — Wiring Schematic</text>
  <text x="600" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">ESP32-S3 + TCA9548A + 8× DRV2605L + 8× LRA + INMP441</text>

  <!-- ESP32-S3 Block -->
  <rect x="60" y="120" width="200" height="320" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="145" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">ESP32-S3 DevKitC-1</text>
  <text x="160" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">N16R8 (16MB+8MB)</text>

  <!-- ESP32 Pins -->
  <text x="75" y="195" fill="#f59e0b" font-size="10">GPIO 8 (SDA)</text>
  <text x="75" y="215" fill="#f59e0b" font-size="10">GPIO 9 (SCL)</text>
  <text x="75" y="245" fill="#a78bfa" font-size="10">GPIO 5 (I2S_SCK)</text>
  <text x="75" y="265" fill="#a78bfa" font-size="10">GPIO 6 (I2S_WS)</text>
  <text x="75" y="285" fill="#a78bfa" font-size="10">GPIO 7 (I2S_SD)</text>
  <text x="75" y="315" fill="#ef4444" font-size="10">GPIO 4 (E-STOP)</text>
  <text x="75" y="340" fill="#22c55e" font-size="10">GPIO 15 (LED_G)</text>
  <text x="75" y="360" fill="#ef4444" font-size="10">GPIO 16 (LED_R)</text>
  <text x="75" y="385" fill="#06b6d4" font-size="10">GPIO 2 (BAT_ADC)</text>
  <text x="75" y="415" fill="#e2e8f0" font-size="10">USB-C (prog)</text>

  <!-- I2C Bus Lines -->
  <line x1="260" y1="191" x2="380" y2="191" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="211" x2="380" y2="211" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="185" text-anchor="middle" fill="#f59e0b" font-size="8">I2C</text>

  <!-- TCA9548A Block -->
  <rect x="390" y="120" width="180" height="320" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="145" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold">TCA9548A</text>
  <text x="480" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">I2C Multiplexer (0x70)</text>

  <!-- MUX Channels -->
  <text x="405" y="195" fill="#e2e8f0" font-size="10">CH0 → Wrist Volar</text>
  <text x="405" y="215" fill="#e2e8f0" font-size="10">CH1 → Wrist Dorsal</text>
  <text x="405" y="240" fill="#e2e8f0" font-size="10">CH2 → Thumb</text>
  <text x="405" y="260" fill="#e2e8f0" font-size="10">CH3 → Index</text>
  <text x="405" y="280" fill="#e2e8f0" font-size="10">CH4 → Middle</text>
  <text x="405" y="300" fill="#e2e8f0" font-size="10">CH5 → Ring</text>
  <text x="405" y="320" fill="#e2e8f0" font-size="10">CH6 → Pinky</text>
  <text x="405" y="340" fill="#e2e8f0" font-size="10">CH7 → Forearm</text>

  <!-- DRV2605L Array -->
  <rect x="630" y="120" width="180" height="320" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="720" y="145" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="bold">DRV2605L × 8</text>
  <text x="720" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">Haptic Drivers (all 0x5A)</text>

  <!-- DRV channels -->
  <text x="645" y="195" fill="#e2e8f0" font-size="10">#0 LRA OUT → ○</text>
  <text x="645" y="215" fill="#e2e8f0" font-size="10">#1 LRA OUT → ○</text>
  <text x="645" y="240" fill="#e2e8f0" font-size="10">#2 LRA OUT → ○</text>
  <text x="645" y="260" fill="#e2e8f0" font-size="10">#3 LRA OUT → ○</text>
  <text x="645" y="280" fill="#e2e8f0" font-size="10">#4 LRA OUT → ○</text>
  <text x="645" y="300" fill="#e2e8f0" font-size="10">#5 LRA OUT → ○</text>
  <text x="645" y="320" fill="#e2e8f0" font-size="10">#6 LRA OUT → ○</text>
  <text x="645" y="340" fill="#e2e8f0" font-size="10">#7 LRA OUT → ○</text>

  <!-- Connection lines MUX to DRV -->
  <line x1="570" y1="200" x2="630" y2="200" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="220" x2="630" y2="220" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="240" x2="630" y2="240" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="260" x2="630" y2="260" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="280" x2="630" y2="280" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="300" x2="630" y2="300" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="320" x2="630" y2="320" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="570" y1="340" x2="630" y2="340" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- LRA Array -->
  <rect x="870" y="120" width="280" height="320" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="1010" y="145" text-anchor="middle" fill="#ec4899" font-size="13" font-weight="bold">LRA Actuators × 8</text>
  <text x="1010" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">10mm Coin Type, Z-axis, ~175Hz</text>

  <!-- LRA positions -->
  <circle cx="920" cy="195" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="199" fill="#e2e8f0" font-size="10">Wrist (volar/palmar)</text>
  <circle cx="920" cy="220" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="224" fill="#e2e8f0" font-size="10">Wrist (dorsal/back)</text>
  <circle cx="920" cy="250" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="254" fill="#e2e8f0" font-size="10">Thumb (thenar)</text>
  <circle cx="920" cy="275" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="279" fill="#e2e8f0" font-size="10">Index finger (MCP)</text>
  <circle cx="920" cy="300" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="304" fill="#e2e8f0" font-size="10">Middle finger (MCP)</text>
  <circle cx="920" cy="325" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="329" fill="#e2e8f0" font-size="10">Ring finger (MCP)</text>
  <circle cx="920" cy="350" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="354" fill="#e2e8f0" font-size="10">Pinky finger (MCP)</text>
  <circle cx="920" cy="375" r="8" fill="none" stroke="#ec4899" stroke-width="1.5"/>
  <text x="940" y="379" fill="#e2e8f0" font-size="10">Forearm (extensor)</text>

  <!-- Connection lines DRV to LRA -->
  <line x1="810" y1="195" x2="912" y2="195" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="215" x2="912" y2="220" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="240" x2="912" y2="250" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="260" x2="912" y2="275" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="280" x2="912" y2="300" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="300" x2="912" y2="325" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="320" x2="912" y2="350" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="810" y1="340" x2="912" y2="375" stroke="#22c55e" stroke-width="1.5"/>

  <!-- INMP441 Microphone -->
  <rect x="60" y="500" width="200" height="100" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="160" y="530" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">INMP441 MEMS Mic</text>
  <text x="160" y="550" text-anchor="middle" fill="#94a3b8" font-size="9">I2S Digital Output, 16kHz</text>
  <text x="160" y="575" text-anchor="middle" fill="#94a3b8" font-size="9">Omnidirectional, -26 dBFS</text>

  <!-- I2S lines -->
  <line x1="160" y1="500" x2="160" y2="440" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="172" y="475" fill="#a78bfa" font-size="8">I2S Bus</text>

  <!-- Power System -->
  <rect x="390" y="500" width="280" height="100" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="530" y="525" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold">Power System</text>

  <text x="405" y="550" fill="#e2e8f0" font-size="10">LiPo 3.7V 500mAh → TP4056 → USB-C Charge</text>
  <text x="405" y="570" fill="#e2e8f0" font-size="10">AMS1117 3.3V LDO → All ICs</text>
  <text x="405" y="590" fill="#e2e8f0" font-size="10">Slide switch (SPDT) → Power on/off</text>

  <!-- Power distribution lines -->
  <line x1="530" y1="500" x2="530" y2="455" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="530" y1="455" x2="160" y2="455" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="530" y1="455" x2="480" y2="455" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="530" y1="455" x2="720" y2="455" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="465" fill="#ef4444" font-size="8">3.3V Rail</text>

  <!-- UI Elements -->
  <rect x="740" y="500" width="180" height="100" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="830" y="525" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="bold">User Interface</text>
  <text x="755" y="550" fill="#e2e8f0" font-size="10">● Green LED (status)</text>
  <text x="755" y="570" fill="#e2e8f0" font-size="10">● Red LED (error/low bat)</text>
  <text x="755" y="590" fill="#e2e8f0" font-size="10">◼ Emergency stop button</text>

  <!-- UI connection -->
  <line x1="830" y1="500" x2="250" y2="340" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="60" y="650" width="1090" height="100" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="80" y="675" fill="#e2e8f0" font-size="11" font-weight="bold">Legend</text>

  <line x1="80" y1="695" x2="120" y2="695" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="699" fill="#94a3b8" font-size="10">I2C Bus (SDA/SCL, 4.7kΩ pull-ups)</text>

  <line x1="350" y1="695" x2="390" y2="695" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="699" fill="#94a3b8" font-size="10">I2S Bus (SCK/WS/SD)</text>

  <line x1="600" y1="695" x2="640" y2="695" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="699" fill="#94a3b8" font-size="10">Actuator Drive (DRV OUT± → LRA)</text>

  <line x1="900" y1="695" x2="940" y2="695" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="950" y="699" fill="#94a3b8" font-size="10">Power (3.3V)</text>

  <text x="80" y="730" fill="#94a3b8" font-size="10">All DRV2605L share I2C address 0x5A — TCA9548A selects which one responds on the bus.</text>
  <text x="80" y="745" fill="#94a3b8" font-size="10">ESP32-S3 runs Vosk STT (via Python bridge) or Edge Impulse TinyML (standalone) for voice commands.</text>
</svg>
